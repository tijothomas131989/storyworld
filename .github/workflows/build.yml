name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"

      - name: Create Flutter Android project structure
        run: |
          flutter create . --project-name storyworld --platforms=android --android-language kotlin --overwrite

      - name: Add app dependencies
        run: |
          flutter pub add webview_flutter shared_preferences device_info_plus

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storyworld-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
