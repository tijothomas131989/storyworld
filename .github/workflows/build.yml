name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"

      - name: Clean old build files
        run: |
          rm -rf android ios web windows macos linux .dart_tool build

      - name: Create Flutter Android project
        run: |
          flutter create . --project-name storyworld --platforms=android --android-language kotlin --overwrite

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storyworld-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
